<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON//LINK</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div><small>NIGHT CITY // COMMS</small><h1>NEON<span>//</span>LINK</h1></div><span id="status">Conectando...</span></header><section id="intro"></section><section id="gmTools" hidden><div class="row"><label>Jogador <select id="target"></select></label><button id="refresh">↻</button></div><div class="row"><label>Contato NPC <select id="npc"></select></label><button id="addNpc">+ NPC</button></div><button id="editNpc">Editar contato/foto</button></section><div id="conversationList"></div><section id="chat" hidden><div class="chatTop"><button id="back">‹</button><img id="avatar" alt=""><div><strong id="chatName"></strong><small id="chatSub"></small></div></div><div id="messages"></div><form id="compose"><input id="message" placeholder="Escreva uma mensagem..." maxlength="1200" autocomplete="off" required><button type="submit">➤</button></form></section><footer id="footer">As mensagens são sincronizadas somente com quem está online.</footer></div><script type="module" src="app.js"></script></body></html>
